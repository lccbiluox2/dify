          \ if events_json else []\n    item = events[index] if 0 <= index < len(events)\
          \ else {}\n\n    event_id = item.get(\"id\", \"\")\n    event_name = item.get(\"\
          name\", \"\")\n    focus_ip = item.get(\"focusIp\", \"\") or \"\"\n    focus_object_cn\
          \ = item.get(\"focusObjectCN\", \"\")\n    threat_severity = item.get(\"\
          threatSeverity\", \"\")\n    alarm_status = item.get(\"alarmStatus\", \"\
          \")\n    sub_category = item.get(\"subCategory\", \"\")\n\n    desc = f\"\
          安全事件自动阻断: {event_name} (ID:{event_id}, 等级:{threat_severity})\"\n\n    return\
          \ {\n        \"event\": item,\n        \"event_id\": str(event_id),\n  \
          \      \"event_name\": event_name,\n        \"focus_ip\": focus_ip,\n  \
          \      \"ip_to_block\": focus_ip,\n        \"focus_object_cn\": focus_object_cn,\n\
          \        \"threat_severity\": threat_severity,\n        \"alarm_status\"\
          : alarm_status,\n        \"sub_category\": sub_category,\n        \"block_desc\"\
          : desc,\n    }\n"
