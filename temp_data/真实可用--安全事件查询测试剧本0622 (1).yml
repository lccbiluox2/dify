          \ in tool_json:\n            if isinstance(page, dict):\n              \
          \  data = page.get(\"data\")\n                if isinstance(data, list):\n\
          \                    # 原始格式: page.data 直接是列表\n                    events.extend(data)\n\
          \                elif isinstance(data, dict) and isinstance(data.get(\"\
          data\"), list):\n                    # API 响应格式: page.data.data 是列表\n  \
          \                  events.extend(data[\"data\"])\n\n    block_events = [\n\
          \        e for e in events\n        if e.get(\"focusIp\")\n    ]\n\n   \
          \ return {\n        \"events_json\": json.dumps(block_events, ensure_ascii=False),\n\
          \        \"indices\": list(range(len(block_events))),\n        \"total\"\
          : len(block_events),\n        \"all_total\": len(events),\n    }"
